name: NotchDeck
options:
  bundleIdPrefix: com.salomohutapea
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  NotchDeck:
    type: application
    platform: macOS
    sources:
      - path: NotchDeck
        excludes:
          - "Resources/Info.plist"
          - "Resources/NotchDeck.entitlements"
          - "Resources/*.sh"
      - path: NotchDeck/Resources
        includes:
          - "*.sh"
        buildPhase: resources
    info:
      path: NotchDeck/Resources/Info.plist
      properties:
        CFBundleName: NotchDeck
        CFBundleDisplayName: NotchDeck
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        NSAppleEventsUsageDescription: "NotchDeck reads what's playing in Music and Spotify and controls playback."
        NSBluetoothAlwaysUsageDescription: "NotchDeck shows when your Bluetooth accessories connect."
    entitlements:
      path: NotchDeck/Resources/NotchDeck.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.salomohutapea.NotchDeck
        PRODUCT_NAME: NotchDeck
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: NO
        Release:
          ENABLE_HARDENED_RUNTIME: YES
