name: Release

# Push a tag like v1.0.0 to build an unsigned DMG and publish it as a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Resolve version
        id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Set marketing version from the tag
        run: |
          sed -i '' "s/MARKETING_VERSION: .*/MARKETING_VERSION: \"${{ steps.v.outputs.version }}\"/" project.yml
          sed -i '' "s/CURRENT_PROJECT_VERSION: .*/CURRENT_PROJECT_VERSION: \"${{ github.run_number }}\"/" project.yml
      - name: Build DMG (ad-hoc signed, no Apple Developer account)
        run: scripts/make-dmg.sh
      - name: Write release notes
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          VERSION="${{ steps.v.outputs.version }}"
          REPO="${{ github.repository }}"
          PREV=$(git tag --sort=-v:refname | grep -v "^$TAG$" | head -1 || true)
          if [ -n "$PREV" ]; then
            LOG="[$PREV...$TAG](https://github.com/$REPO/compare/$PREV...$TAG)"
          else
            LOG="[$TAG](https://github.com/$REPO/commits/$TAG)"
          fi
          {
            echo "Unsigned macOS build of NotchDeck $VERSION (Apple Silicon and Intel)."
            echo "macOS will warn that the app is from an unidentified developer. After installing, either open System Settings > Privacy & Security and click Open Anyway, or run:"
            echo
            echo '```'
            echo "xattr -dr com.apple.quarantine /Applications/NotchDeck.app"
            echo '```'
            echo
            echo "Full Changelog: $LOG"
          } > release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          FILES="dist/NotchDeck-${{ steps.v.outputs.version }}.dmg dist/NotchDeck-${{ steps.v.outputs.version }}.dmg.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES --title "NotchDeck ${{ steps.v.outputs.version }}" --notes-file release-notes.md
          fi
